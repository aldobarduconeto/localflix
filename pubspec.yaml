name: localflix
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  fvp: ^0.39.1
  flutter_svg: ^2.3.0
  file_picker: ^13.2.0
  just_audio: ^0.9.42
  video_player: ^2.9.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/tmdb.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/localflix-icon.png
  remove_alpha_ios: true
  adaptive_icon_background: '#0C0E14'
  adaptive_icon_foreground: assets/localflix-icon.png
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    background_color: '#0C0E14'
    theme_color: '#0C0E14'
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
